spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.web.resources.static-locations=classpath:/static/

youtube.api.key=${YOUTUBE_API_KEY}
gemini.api.key=${GEMINI_API_KEY}

ebay.client.id=${EBAY_CLIENT_ID}
ebay.client.secret=${EBAY_CLIENT_SECRET}
ebay.api.base-url=https://api.ebay.com

# Seed default only, used when the app_settings row is missing (fresh DB). Once the
# migration's INSERT has run, the admin-controlled DB value wins and this is ignored.
app.registration.enabled=false

# Per-role monthly usage caps live in the app_settings table (seeded by migration
# V11, admin-editable at /admin/settings). Not set here -- UsageLimits has inline
# code defaults for the case where the row is somehow missing.

server.forward-headers-strategy=framework

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
server.servlet.session.timeout=2d
