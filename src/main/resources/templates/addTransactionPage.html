<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add Transaction</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>
    <script type="text/javascript" th:src="@{/js/responsive-card-table.js}"></script>
    <script type="text/javascript" th:src="@{/js/icons.js}"></script>
    <script th:inline="javascript">
      var storages = /*[[${storages}]]*/ [];
      var storageOptionsHtml = '<option value="">-- none --</option>' +
        storages.map(function (s) {
          return '<option value="' + s.id + '">' + s.name + '</option>';
        }).join('');
    </script>

    <script>
      $(document).ready(function () {
        $.ajaxSetup({
          beforeSend: function(xhr) {
            xhr.setRequestHeader(
              $('meta[name="_csrf_header"]').attr('content'),
              $('meta[name="_csrf"]').attr('content')
            );
          }
        });

        $("#forCards .card-data .storage").html(storageOptionsHtml);

        //todo

        var clipboardCard = {
          year: "",
          publisher: "",
          set: "",
          player: "",
          auto: false,
          insert: "",
          parallel: "",
          numbered: "",
          sports: "",
          grade: "",
          value: "",
          storage: "",
        };

        function getCardList() {
          var cardList = [];
          $("#forCards .card-data").each(function () {
            var cardData = {
              year: $(this).find(".year").val(),
              publisher: $(this).find(".publisher").val(),
              set: $(this).find(".set").val(),
              player: $(this).find(".player").val(),
              auto: $(this).find(".auto").is(":checked") ? true : false,
              insert: $(this).find(".insert").val(),
              parallel: $(this).find(".parallel").val(),
              numbered: $(this).find(".numbered").val(),
              sports: $(this).find(".sports").val(),
              grade: $(this).find(".grade").val(),
              value: $(this).find(".value").val(),
              storageId: $(this).find(".storage").val() || null,
            };

            cardList.push(cardData);
          });
          return cardList;
        }

        function addCard() {
          var newCard = `
          <tr class="card-data">
            <td><input type="text" class="year" id="year" size="4" /></td>
            <td><input type="text" class="sports" id="sports" size="6" /></td>
            <td><input type="text" class="publisher" id="publisher" size="6" /></td>
            <td><input type="text" class="set" id="set" size="10" /></td>
            <td><input type="text" class="player" id="player" /></td>
            <td><input type="checkbox" class="auto" /></td>
            <td><input type="text" class="insert" id="insert" size="6" /></td>
            <td><input type="text" class="parallel" id="parallel" size="6" /></td>
            <td><input type="text" class="numbered" id="numbered" size="6" /></td>
            <td><input type="text" class="grade" id="grade" size="6" /></td>
            <td><input type="text" class="value" id="value" size="6" /></td>
            <td><select class="storage">` + storageOptionsHtml + `</select></td>
            <td>
              <span class="row-actions">
                ${iconBtn("copy action-butt action-icon", "copy", "copy")}
                ${iconBtn("paste action-butt action-icon", "paste", "paste")}
                ${iconBtn("clear action-butt action-icon cancel", "eraser", "clear")}
                ${iconBtn("delete-card action-butt action-icon cancel", "trash", "delete")}
              </span>
            </td>
          </tr>`;
          $("#forCards").append(newCard);
        }

        function saveTransaction() {
          var transaction = {
            date: $("#date").val(),
            type: $("#type").val(),
            amount: $("#amount").val(),
            // #note is the popover wrapper; the text lives in #note-text.
            note: $("#note-text").val(),
          };

          if (
            transaction.date == "" ||
            null ||
            transaction.type == "" ||
            null ||
            transaction.amount == "" ||
            null
          ) {
            alert("unfilled necessary column");
            return false;
          }

          var transactionWithCard = {
            transaction: transaction,
            cards: getCardList(),
          };

          $.ajax({
            url: "/card/saveTransaction",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(transactionWithCard),
            success: function (response) {
              alert("transaction added successfully");
              window.location.href = "/card";
            },
            error: function (error) {
              alert("error : " + error);
            },
          });
        }

        $("#add-card").on("click", function () {
          addCard();
        });

        $("#add-transaction").on("click", function () {
          saveTransaction();
        });

        // delete card row
        $("#forCards").on("click", ".delete-card", function () {
          var row = $(this).closest(".card-data");
          row.remove();
        });

        // clear all data in card row
        $("#forCards").on("click", ".clear", function () {
          var row = $(this).closest(".card-data");
          row.find(".year").val("");
          row.find(".publisher").val("");
          row.find(".set").val("");
          row.find(".player").val("");
          row.find(".auto").prop("checked", false);
          row.find(".insert").val("");
          row.find(".parallel").val("");
          row.find(".numbered").val("");
          row.find(".sports").val("");
          row.find(".grade").val("");
          row.find(".value").val("");
          row.find(".storage").val("");
        });

        // copy card row data to clipboard
        $("#forCards").on("click", ".copy", function () {
          var row = $(this).closest(".card-data");
          clipboardCard.year = row.find(".year").val();
          clipboardCard.publisher = row.find(".publisher").val();
          clipboardCard.set = row.find(".set").val();
          clipboardCard.player = row.find(".player").val();
          clipboardCard.auto = row.find(".auto").prop("checked");
          clipboardCard.insert = row.find(".insert").val();
          clipboardCard.parallel = row.find(".parallel").val();
          clipboardCard.numbered = row.find(".numbered").val();
          clipboardCard.sports = row.find(".sports").val();
          clipboardCard.grade = row.find(".grade").val();
          clipboardCard.value = row.find(".value").val();
          clipboardCard.storage = row.find(".storage").val();
        });

        // past clipboard card data to card row
        $("#forCards").on("click", ".paste", function () {
          var row = $(this).closest(".card-data");
          row.find(".year").val(clipboardCard.year);
          row.find(".publisher").val(clipboardCard.publisher);
          row.find(".set").val(clipboardCard.set);
          row.find(".player").val(clipboardCard.player);
          row.find(".auto").prop("checked", clipboardCard.auto);
          row.find(".insert").val(clipboardCard.insert);
          row.find(".parallel").val(clipboardCard.parallel);
          row.find(".numbered").val(clipboardCard.numbered);
          row.find(".sports").val(clipboardCard.sports);
          row.find(".grade").val(clipboardCard.grade);
          row.find(".value").val(clipboardCard.value);
          row.find(".storage").val(clipboardCard.storage);
        });
      });

      function showNote() {
        $("#note").show();
      }
      function hideNote() {
        $("#note").hide();
      }
    </script>

    <link rel="stylesheet" th:href="@{/assets/style.css}" />
    <link rel="stylesheet" th:href="@{/assets/page-shell.css}" />
    <link rel="stylesheet" th:href="@{/assets/card-pages.css}" />
    <link rel="stylesheet" th:href="@{/assets/responsive-tables.css}" />
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>
    <div class="page-top">
      <div class="page-shell page-shell-wide">
        <div class="page-header page-header-gold">
          <div class="page-header-text">
            <span class="eyebrow">Ledger</span>
            <h1>Add New Transaction</h1>
            <p>Record a break, buy, trade or giveaway, then list the cards that came out of it.</p>
          </div>
        </div>

        <div class="filter-panel">
          <div class="filter-grid">
            <div class="filter-field">
              <label for="date"><i class="req">*</i> date</label>
              <input type="date" id="date" />
            </div>
            <div class="filter-field">
              <label for="type"><i class="req">*</i> type</label>
              <select id="type">
                <option value="Break">Break</option>
                <option value="Buy">Buy</option>
                <option value="Trade">Trade</option>
                <option value="Giveaway">Giveaway</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="amount"><i class="req">*</i> amount</label>
              <input type="text" id="amount" inputmode="decimal" />
            </div>
            <div class="filter-field filter-field-check">
              <button type="button" class="note-trigger" onclick="showNote()" title="Add a note" aria-label="Add a note">
                <svg th:replace="~{fragments/icons :: note}"></svg>
              </button>
              <label>note</label>
            </div>
          </div>
        </div>

        <div class="tran-section-title">Cards in this transaction</div>

        <div class="page-toolbar">
          <span class="toolbar-count">Fields marked <i class="req">*</i> are required on every card row.</span>
          <button id="add-card" class="neon-butt">+ Add card row</button>
        </div>

        <div id="add">
          <div class="table-center">
          <table id="forCards" class="entry-table mobile-form">
            <tr>
              <th><i class="req">*</i>year</th>
              <th>sports</th>
              <th>publisher</th>
              <th><i class="req">*</i>set</th>
              <th><i class="req">*</i>player</th>
              <th>auto</th>
              <th>insert</th>
              <th>parallel</th>
              <th>numbered</th>
              <th>grade</th>
              <th>value</th>
              <th>storage</th>
              <th>action</th>
            </tr>
            <tr class="card-data">
              <td><input type="text" class="year" id="year" size="4" /></td>
              <td><input type="text" class="sports" id="sports" size="6" /></td>
              <td><input type="text" class="publisher" id="publisher" size="6" /></td>
              <td><input type="text" class="set" id="set" size="10" /></td>
              <td><input type="text" class="player" id="player" /></td>
              <td><input type="checkbox" class="auto" /></td>
              <td><input type="text" class="insert" id="insert" size="6" /></td>
              <td><input type="text" class="parallel" id="parallel" size="6" /></td>
              <td><input type="text" class="numbered" id="numbered" size="6" /></td>
              <td><input type="text" class="grade" id="grade" size="6" /></td>
              <td><input type="text" class="value" id="value" size="6" /></td>
              <td><select class="storage"><option value="">-- none --</option></select></td>
              <td>
                <span class="row-actions">
                  <button class="copy action-butt action-icon" title="Copy this row" aria-label="Copy this row">
                    <svg th:replace="~{fragments/icons :: copy}"></svg>
                    <span class="btn-label">copy</span>
                  </button>
                  <button class="paste action-butt action-icon" title="Paste into this row" aria-label="Paste into this row">
                    <svg th:replace="~{fragments/icons :: paste}"></svg>
                    <span class="btn-label">paste</span>
                  </button>
                  <button class="clear action-butt action-icon cancel" title="Clear this row" aria-label="Clear this row">
                    <svg th:replace="~{fragments/icons :: eraser}"></svg>
                    <span class="btn-label">clear</span>
                  </button>
                  <button class="delete-card action-butt action-icon cancel" title="Remove this row" aria-label="Remove this row">
                    <svg th:replace="~{fragments/icons :: trash}"></svg>
                    <span class="btn-label">delete</span>
                  </button>
                </span>
              </td>
            </tr>
          </table>
          </div>

          <div id="note" class="note-pop">
            <div class="note-pop-head">
              <span>Transaction note</span>
              <button type="button" class="icon-btn icon-btn-destroy" onclick="hideNote()" title="Close note" aria-label="Close note">&times;</button>
            </div>
            <textarea id="note-text" name="note" rows="4"></textarea>
          </div>
        </div>

        <div class="filter-actions">
          <button id="add-transaction" class="confirm-butt">Add Transaction</button>
        </div>
      </div>
    </div>
  </body>
</html>
