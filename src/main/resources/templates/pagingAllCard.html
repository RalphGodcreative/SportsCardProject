<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

  <title>Cards</title>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <script type="text/javascript" th:src="@{/js/util.js}"></script>
  <script>
    $(document).ready(function () {
      $.ajaxSetup({
        beforeSend: function(xhr) {
          xhr.setRequestHeader(
            $('meta[name="_csrf_header"]').attr('content'),
            $('meta[name="_csrf"]').attr('content')
          );
        }
      });

      var cardCounts = $("#card-counts").val();
      var currentPage = $("#current-page").val();
      var totalPages = Math.floor(cardCounts / 10);
      if (cardCounts % 10 > 0) {
        totalPages++;
      }

      for (let i = 1; i <= totalPages; i++) {
        let cls = "index join-item btn btn-sm";
        if (i == currentPage) {
          cls += " btn-active current-index";
        }
        $("#page-index").append(
          '<a class="' + cls + '" href="/card/cards?page=' + i + '">' + i + '</a>'
        );
      }

      //to switch page
      $("#first-page").on("click", function () {
        if (currentPage != 1)
          window.location.href = "/card/cards?page=" + 1;
      });
      $("#last-page").on("click", function () {
        if (currentPage != totalPages)
          window.location.href = "/card/cards?page=" + totalPages;
      });
      $("#prev-page").on("click", function () {
        if (currentPage != 1)
          window.location.href = "/card/cards?page=" + (currentPage - 1);
      });
      $("#next-page").on("click", function () {
        if (currentPage != totalPages) {
          var currentPageNumber = parseInt(currentPage);
          window.location.href =
            "/card/cards?page=" + (currentPageNumber + 1);
        }
      });

      $(".modify").on("click", function () {
        var row = $(this).closest("tr");
        row.find(".show").hide();
        row.find(".update-element").show();
      });

      $(".comps").on("click", function () {
        var row = $(this).closest("tr");
        var link = getCompLink(row);
        window.open(link, "_blank");
      });

      function formatAnalysis(text) {
        var escaped = $("<div>").text(text).html();
        var formatted = escaped.replace(/\*\*Potential Rating:\*\*\s*(Low|Medium|High)/gi, function (match, rating) {
          return "<strong>Potential Rating:</strong> <span class=\"rating-" + rating.toLowerCase() + "\">" + rating + "</span>";
        });
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        formatted = formatted.replace(/\n/g, "<br>");
        return formatted;
      }

      $(".potential-btn").on("click", function () {
        var cardId = $(this).data("id");
        $("#potential-modal-body").text("Loading...");
        $("#potential-modal").addClass("modal-open");
        $.ajax({
          url: "/cardRest/" + cardId + "/potential",
          type: "GET",
          success: function (response) {
            var data = typeof response === "string" ? JSON.parse(response) : response;
            $("#potential-modal-body").html(formatAnalysis(data.analysis || data.error || "No response."));
          },
          error: function () {
            $("#potential-modal-body").text("Failed to fetch analysis.");
          },
        });
      });

      $("#potential-modal-close, #potential-modal-backdrop").on("click", function () {
        $("#potential-modal").removeClass("modal-open");
      });

      $(".cancel").on("click", function () {
        var row = $(this).closest("tr");
        row.find(".show").show();
        row.find(".update-element").hide();
      });

      $(".save").on("click", function () {
        var row = $(this).closest("tr");

        var cardData = {
          id: row.find(".id").val(),
          year: row.find(".year").val(),
          publisher: row.find(".publisher").val(),
          set: row.find(".set").val(),
          player: row.find(".player").val(),
          auto: row.find(".auto").is(":checked") ? true : false,
          insert: row.find(".insert").val(),
          parallel: row.find(".parallel").val(),
          numbered: row.find(".numbered").val(),
          sports: row.find(".sports").val(),
          grade: row.find(".grade").val(),
          value: row.find(".value").val(),
          tagIds: TagPicker.get(row.find(".tag-picker")),
        };

        var formData = $.param(cardData, true); // traditional: tagIds=1&tagIds=2

        $.ajax({
          url: "/card/updateCard",
          type: "POST",
          // contentType: "application/json",
          data: formData,
          success: function (response) {
            alert("card info updated successfully");
            window.location.href = "/card/cards?page=" + currentPage;
          },
          error: function (error) {
            console.log(error);
            alert("error : " + error);
          },
        });
      });

    });
  </script>

  <th:block th:replace="~{fragments/head :: styles}"></th:block>
  <th:block th:replace="~{fragments/tagCell :: assets}"></th:block>
</head>

<body>
  <div th:replace="~{banner.html :: header}"></div>

  <!-- AI potential. daisyUI modal, opened by adding .modal-open. -->
  <div id="potential-modal" class="modal">
    <div class="modal-box" style="max-width: 34rem;">
      <h3 style="margin: 0 0 0.75rem; font-size: 1.125rem; font-weight: 900; color: var(--rg-ai); text-shadow: 0 0 10px rgba(246, 76, 189, 0.5);">
        AI Price Rise Potential
      </h3>
      <div id="potential-modal-body" style="line-height: 1.8;">Loading...</div>
      <div class="modal-action">
        <button id="potential-modal-close" class="btn btn-sm btn-outline btn-error">Close</button>
      </div>
    </div>
    <div id="potential-modal-backdrop" class="modal-backdrop"></div>
  </div>

  <div class="rg-page rg-page--wide">

    <div class="rg-page-head">
      <h1>Cards</h1>
      <p>你的球員卡收藏。點 modify 直接在列上編輯，potential 會呼叫 AI 評估增值空間。</p>
    </div>

    <div class="rg-toolbar">
      <div class="rg-quota">
        <div class="rg-quota__count">
          <strong th:text="${cardCounts}">0</strong>
          <span th:if="${maxCards == T(java.lang.Integer).MAX_VALUE}">/ unlimited cards</span>
          <span th:unless="${maxCards == T(java.lang.Integer).MAX_VALUE}"
                th:text="'/ ' + ${maxCards} + ' cards'">/ 0 cards</span>
        </div>
        <progress th:unless="${maxCards == T(java.lang.Integer).MAX_VALUE}"
                  class="progress progress-secondary"
                  th:value="${cardCounts}" th:max="${maxCards}"></progress>
      </div>

      <div class="rg-rule"></div>

      <a href="/card/searchCard" class="btn btn-sm btn-outline btn-accent">search cards</a>
      <a href="/transactions/" class="btn btn-sm btn-outline btn-accent">transactions</a>
      <a href="/tag" class="btn btn-sm btn-outline btn-accent">manage tags</a>

      <span class="rg-spacer"></span>

      <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/card/allCard" class="btn btn-sm btn-ghost">
        show all in one page
        <span class="badge badge-sm badge-secondary">admin</span>
      </a>
      <a href="/card/addNewCard" class="btn btn-sm btn-success">add new card</a>
    </div>

    <div class="rg-table-card">
      <table class="table table-zebra rg-table rg-card-table" id="card-table">
        <thead>
          <tr>
            <th:block th:replace="~{fragments/cardRow :: headers}"></th:block>
            <th>tags</th>
            <th>action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="card : ${cards}">

            <th:block th:replace="~{fragments/cardRow :: cells(${card})}"></th:block>

            <td th:replace="~{fragments/tagCell :: cell(${card})}"></td>

            <td class="rg-cell-actions" data-label="action">
              <div class="rg-actions">
                <button class="show btn btn-xs btn-outline btn-accent modify">modify</button>
                <button class="show btn btn-xs btn-outline btn-accent comps">comps</button>
                <button class="show btn btn-xs btn-outline btn-accent get-tran"
                        th:onclick="'window.location.href=\'/card/cardTransaction/' + ${card.id} + '\''">
                  transaction
                </button>
                <button class="show btn btn-xs btn-outline rg-btn-ai potential-btn" th:data-id="${card.id}">potential</button>
                <button class="update-element btn btn-xs btn-success save">save</button>
                <button class="update-element btn btn-xs btn-outline btn-error cancel">cancel</button>
              </div>
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(cards)}">
            <td colspan="15" style="text-align: center; padding: 2.5rem 1rem; color: var(--rg-dim);">
              這一頁沒有卡片。<a href="/card/addNewCard" class="link link-primary">新增第一張卡片</a>。
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="rg-pager">
      <span style="font-size: 0.8125rem; color: var(--rg-dim);">
        total cards: <span th:text="${cardCounts}">0</span>
      </span>
      <span class="rg-spacer"></span>
      <div class="join" id="page-control">
        <button class="join-item btn btn-sm" id="first-page">&lt;&lt;</button>
        <button class="join-item btn btn-sm" id="prev-page">&lt;</button>
        <span id="page-index" style="display: contents;"></span>
        <button class="join-item btn btn-sm" id="next-page">&gt;</button>
        <button class="join-item btn btn-sm" id="last-page">&gt;&gt;</button>
      </div>
    </div>

    <input type="hidden" id="card-counts" th:value="${cardCounts}" />
    <input type="hidden" id="current-page" th:value="${page}" />

  </div>
</body>

</html>
