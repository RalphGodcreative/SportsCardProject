<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>
  <div class="rg-auth-page">
    <div class="rg-auth-card">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 0.875rem; margin-bottom: 1.75rem;">
        <img th:src="@{/img/RGForBanner.png}" alt="RG Sports Cards" style="width: 92px; height: 63px; display: block;" />
        <div style="text-align: center;">
          <h1 style="margin: 0 0 0.375rem; font-size: 1.375rem; font-weight: 900;">Sign in</h1>
          <p style="margin: 0; font-size: 0.875rem; color: var(--rg-muted);">回到你的球員卡收藏</p>
        </div>
      </div>

      <form th:action="@{/login}" method="post">
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <label class="rg-field">
            <span class="rg-field__label">Email</span>
            <input type="email" id="email" name="email" class="input" required autofocus />
          </label>

          <label class="rg-field">
            <span class="rg-field__label">Password</span>
            <input type="password" id="password" name="password" class="input" required />
          </label>

          <button type="submit" class="btn btn-success" style="width: 100%;">Sign In</button>
        </div>
      </form>

      <div class="divider" style="margin: 1.375rem 0;">or</div>

      <a href="/oauth2/authorization/google" class="btn btn-outline" style="width: 100%;">
        <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.11 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </a>

      <p class="rg-auth-msg" th:if="${param.error}" style="color: var(--color-error);">Invalid email or password.</p>
      <p class="rg-auth-msg" th:if="${param.logout}" style="color: var(--color-success);">You have been signed out.</p>
      <p class="rg-auth-msg" th:if="${param.registered}" style="color: var(--color-success);">Account created &mdash; you can now sign in.</p>

      <p class="rg-auth-msg" th:if="${registrationEnabled}">
        Don't have an account? <a href="/register" class="link link-primary">Register</a>
      </p>
    </div>
  </div>
</body>
</html>
