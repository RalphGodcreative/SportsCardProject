<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>

    <title>Random</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script>
      function checkIfNull(){
        var list = $("#nameList").val().trim();
        if(list.length==0 || list==''){
          alert('the list can not be empty');
          return false;
        }
      }
    </script>

    <th:block th:replace="~{fragments/head :: styles}"></th:block>

  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>

    <div class="rg-page" style="max-width: 44rem;">

      <div class="rg-page-head">
        <h1>Randomizer</h1>
        <p>貼上一份清單，一行一項，隨機打亂順序。抽獎、分組、決定開卡順序都用得上。</p>
      </div>

      <form method="post" th:action="@{/randomize}" onsubmit="return checkIfNull()">
        <div class="rg-panel rg-panel--plain">
          <label class="rg-field">
            <span class="rg-field__label">Your list &mdash; one item per line</span>
            <textarea th:id="nameList" th:name="nameList" class="textarea" rows="10"
                      style="width: 100%;" placeholder="Ralph&#10;Alex&#10;Sam"></textarea>
          </label>
          <input type="hidden" th:name="randomTimes" th:value="0" />
          <div class="rg-form-actions">
            <button type="submit" class="btn btn-success">Randomize</button>
          </div>
        </div>
      </form>

    </div>
  </body>
</html>
