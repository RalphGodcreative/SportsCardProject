<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users</title>
  <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>
  <div th:replace="~{banner.html :: header}"></div>

  <div class="rg-page rg-page--wide">

    <div class="rg-page-head">
      <h1>Manage users</h1>
      <p>角色、啟用狀態與 AI 呼叫上限。留空 AI limit 代表沿用該角色的預設值。</p>
    </div>

    <div class="alert alert-error alert-soft" th:if="${error}" style="margin-bottom: 1.25rem;">
      <span th:text="${error}"></span>
    </div>

    <div class="rg-table-card">
      <table class="table table-zebra rg-table users-table">
        <thead>
          <tr>
            <th>User</th>
            <th style="width: 9rem;">Role</th>
            <th style="width: 8rem;">Status</th>
            <th style="width: 5rem;">Cards</th>
            <th style="width: 6rem;">Keywords</th>
            <th style="width: 8rem;">AI calls</th>
            <th style="width: 12rem;">AI limit override</th>
            <th style="width: 6rem; text-align: right;"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${rows}">
            <td>
              <div style="font-weight: 700;" th:text="${row.user.username}"></div>
              <div style="font-size: 0.75rem; color: var(--rg-dim);" th:text="${row.user.email}"></div>
            </td>
            <td>
              <span th:if="${row.user.id == #authentication.principal.id}"
                    class="badge badge-sm badge-secondary badge-outline" th:text="${row.user.role}"></span>
              <form th:unless="${row.user.id == #authentication.principal.id}"
                    style="margin: 0;" th:action="@{/admin/users/{id}/role(id=${row.user.id})}" method="post">
                <select name="role" class="select select-sm" style="width: 100%;" onchange="this.form.submit()">
                  <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == row.user.role}"></option>
                </select>
              </form>
            </td>
            <td>
              <span class="badge badge-sm"
                    th:classappend="${row.user.enabled ? 'badge-success' : 'badge-error'}"
                    th:text="${row.user.enabled ? 'Enabled' : 'Disabled'}"></span>
              <div th:if="${row.user.id == #authentication.principal.id}"
                   style="font-size: 0.75rem; font-style: italic; color: var(--rg-dim); margin-top: 0.25rem;">you</div>
              <form th:unless="${row.user.id == #authentication.principal.id}"
                    style="margin: 0.375rem 0 0;"
                    th:action="@{/admin/users/{id}/enabled(id=${row.user.id})}" method="post">
                <input type="hidden" name="enabled" th:value="${!row.user.enabled}" />
                <button type="submit" class="btn btn-xs btn-outline btn-primary" th:text="${row.user.enabled ? 'Disable' : 'Enable'}"></button>
              </form>
            </td>
            <td class="rg-num" th:text="${row.cardCount}"></td>
            <td class="rg-num" th:text="${row.keywordCount}"></td>
            <td class="rg-num" th:text="${row.user.aiCallCount + ' / ' + (row.effectiveMaxAiCalls == T(java.lang.Integer).MAX_VALUE ? 'unlimited' : row.effectiveMaxAiCalls)}"></td>
            <td>
              <form style="margin: 0; display: flex; gap: 0.375rem; align-items: center;"
                    th:action="@{/admin/users/{id}/ai-limit(id=${row.user.id})}" method="post">
                <input type="number" name="maxAiCalls" min="0" placeholder="role default"
                       class="input input-sm" style="width: 6.5rem;"
                       th:value="${row.user.maxAiCallsOverride}" />
                <button type="submit" class="btn btn-xs btn-outline btn-primary">Save</button>
              </form>
            </td>
            <td style="text-align: right;">
              <form th:unless="${row.user.id == #authentication.principal.id}"
                    style="margin: 0;"
                    th:action="@{/admin/users/{id}/delete(id=${row.user.id})}" method="post"
                    onsubmit="return confirm('Delete this user and ALL of their data? This cannot be undone.');">
                <button type="submit" class="btn btn-xs btn-outline btn-error">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</body>
</html>
