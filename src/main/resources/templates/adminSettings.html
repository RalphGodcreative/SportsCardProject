<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Settings</title>
  <link rel="stylesheet" th:href="@{/assets/style.css}" />
  <style>
    .settings-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .settings-box {
      background: #0f0f18;
      border: 1px solid rgba(56, 201, 250, 0.2);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 640px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    .settings-box h2 {
      color: #CA47F5;
      text-shadow: 0 0 10px rgba(202, 71, 245, 0.5);
      margin-top: 0;
      margin-bottom: 1.5rem;
      text-align: center;
      font-family: fantasy;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(56, 201, 250, 0.15);
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .setting-label {
      color: #38C9FA;
      font-family: fantasy;
      font-size: 0.9rem;
      text-shadow: 0 0 6px rgba(56, 201, 250, 0.3);
    }
    .setting-desc {
      color: #666;
      font-size: 0.78rem;
      margin-top: 0.2rem;
      font-family: inherit;
    }
    .setting-state {
      font-size: 0.8rem;
      font-weight: bold;
    }
    .setting-state.on {
      color: #4ade80;
    }
    .setting-state.off {
      color: #f87171;
    }
    .toggle-btn {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: fantasy;
      font-size: 0.85rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(56, 201, 250, 0.15), rgba(202, 71, 245, 0.15));
      border: 1px solid rgba(56, 201, 250, 0.4);
      color: #38C9FA;
      transition: all 0.2s ease;
    }
    .toggle-btn:hover {
      background: linear-gradient(135deg, rgba(56, 201, 250, 0.25), rgba(202, 71, 245, 0.25));
      border-color: #38C9FA;
      color: #f0abfc;
    }
    .settings-box + .settings-box {
      margin-top: 1.5rem;
    }
    .limits-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.2rem;
    }
    .limits-table th, .limits-table td {
      padding: 0.5rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid rgba(56, 201, 250, 0.15);
    }
    .limits-table th {
      color: #38C9FA;
      font-family: fantasy;
      font-size: 0.8rem;
      font-weight: normal;
    }
    .limits-table td.role-label {
      color: #CA47F5;
      font-family: fantasy;
      font-size: 0.85rem;
    }
    .limits-table input[type=number] {
      width: 80px;
      box-sizing: border-box;
      padding: 0.4rem 0.5rem;
      border: 1px solid rgba(56, 201, 250, 0.25);
      border-radius: 4px;
      background: #0a0a0f;
      color: #e2e8f0;
      font-size: 0.9rem;
    }
    .limits-table input[type=number]:focus {
      outline: none;
      border-color: #38C9FA;
      box-shadow: 0 0 8px rgba(56, 201, 250, 0.2);
    }
  </style>
</head>
<body>
  <div th:replace="~{banner.html :: header}"></div>
  <div class="page-top settings-wrap">
    <div class="settings-box">
      <h2>App Settings</h2>

      <div class="setting-row">
        <div>
          <div class="setting-label">Registration</div>
          <div class="setting-desc">Allow new accounts to be created (form and Google login).</div>
        </div>
        <span class="setting-state" th:classappend="${registrationEnabled} ? 'on' : 'off'"
              th:text="${registrationEnabled} ? 'ON' : 'OFF'"></span>
        <form th:action="@{/admin/settings/registration}" method="post" style="margin:0;">
          <input type="hidden" name="enabled" th:value="${!registrationEnabled}" />
          <button type="submit" class="toggle-btn" th:text="${registrationEnabled} ? 'Turn Off' : 'Turn On'"></button>
        </form>
      </div>
    </div>

    <div class="settings-box">
      <h2>Usage Limits</h2>
      <form th:action="@{/admin/settings/usage-limits}" method="post" style="margin:0;">
        <table class="limits-table">
          <tr>
            <th>Role</th>
            <th>Cards</th>
            <th>Keywords</th>
            <th>AI calls / month</th>
          </tr>
          <tr>
            <td class="role-label">ROLE_TEST</td>
            <td><input type="number" name="testMaxCards" min="0" th:value="${testMaxCards}" required /></td>
            <td><input type="number" name="testMaxKeywords" min="0" th:value="${testMaxKeywords}" required /></td>
            <td><input type="number" name="testMaxAiCalls" min="0" th:value="${testMaxAiCalls}" required /></td>
          </tr>
          <tr>
            <td class="role-label">ROLE_USER</td>
            <td><input type="number" name="userMaxCards" min="0" th:value="${userMaxCards}" required /></td>
            <td><input type="number" name="userMaxKeywords" min="0" th:value="${userMaxKeywords}" required /></td>
            <td><input type="number" name="userMaxAiCalls" min="0" th:value="${userMaxAiCalls}" required /></td>
          </tr>
        </table>
        <p class="setting-desc" style="margin:-0.5rem 0 1rem;">ROLE_ADMIN is always unlimited.</p>
        <button type="submit" class="toggle-btn" style="width:100%;">Save Limits</button>
      </form>
    </div>
  </div>
</body>
</html>
