<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Settings</title>
  <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>
  <div th:replace="~{banner.html :: header}"></div>

  <div class="rg-page">

    <div class="rg-page-head">
      <h1>App settings</h1>
      <p>全站設定與各角色的使用額度。</p>
    </div>

    <div class="rg-panel rg-panel--plain" style="margin-bottom: 1.25rem;">
      <h2 class="rg-panel__title" style="color: var(--color-primary);">Registration</h2>
      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <div style="flex-grow: 1; min-width: 16rem;">
          <div style="font-weight: 700; margin-bottom: 0.25rem;">Allow new accounts</div>
          <div style="font-size: 0.8125rem; color: var(--rg-muted);">Form sign-up and Google login both follow this switch.</div>
        </div>
        <span class="badge"
              th:classappend="${registrationEnabled} ? 'badge-success' : 'badge-error'"
              th:text="${registrationEnabled} ? 'ON' : 'OFF'"></span>
        <form th:action="@{/admin/settings/registration}" method="post" style="margin:0;">
          <input type="hidden" name="enabled" th:value="${!registrationEnabled}" />
          <button type="submit" class="btn btn-sm btn-outline btn-primary"
                  th:text="${registrationEnabled} ? 'Turn Off' : 'Turn On'"></button>
        </form>
      </div>
    </div>

    <div class="rg-panel rg-panel--plain">
      <h2 class="rg-panel__title" style="color: var(--color-primary);">Usage limits</h2>
      <form th:action="@{/admin/settings/usage-limits}" method="post" style="margin:0;">

        <div class="rg-table-card" style="margin-bottom: 1rem;">
          <table class="table rg-table rg-form-table">
            <thead>
              <tr>
                <th>Role</th>
                <th>Cards</th>
                <th>Keywords</th>
                <th>AI calls / month</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td data-label="role"><span class="badge badge-sm badge-secondary badge-outline">ROLE_TEST</span></td>
                <td data-label="cards"><input type="number" name="testMaxCards" min="0" class="input input-sm" th:value="${testMaxCards}" required /></td>
                <td data-label="keywords"><input type="number" name="testMaxKeywords" min="0" class="input input-sm" th:value="${testMaxKeywords}" required /></td>
                <td data-label="ai calls"><input type="number" name="testMaxAiCalls" min="0" class="input input-sm" th:value="${testMaxAiCalls}" required /></td>
              </tr>
              <tr>
                <td data-label="role"><span class="badge badge-sm badge-secondary badge-outline">ROLE_USER</span></td>
                <td data-label="cards"><input type="number" name="userMaxCards" min="0" class="input input-sm" th:value="${userMaxCards}" required /></td>
                <td data-label="keywords"><input type="number" name="userMaxKeywords" min="0" class="input input-sm" th:value="${userMaxKeywords}" required /></td>
                <td data-label="ai calls"><input type="number" name="userMaxAiCalls" min="0" class="input input-sm" th:value="${userMaxAiCalls}" required /></td>
              </tr>
            </tbody>
          </table>
        </div>

        <p style="margin: 0 0 1rem; font-size: 0.8125rem; color: var(--rg-muted);">ROLE_ADMIN is always unlimited.</p>
        <button type="submit" class="btn btn-success">Save limits</button>
      </form>
    </div>

  </div>
</body>
</html>
