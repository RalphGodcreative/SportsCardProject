<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add New card</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>

    <link rel="stylesheet" th:href="@{/assets/style.css}" />
    <link rel="stylesheet" th:href="@{/assets/page-shell.css}" />
    <link rel="stylesheet" th:href="@{/assets/card-pages.css}" />
    <link rel="stylesheet" th:href="@{/assets/responsive-tables.css}" />
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>
    <div class="page-top">
      <div class="page-shell">
        <a class="page-breadcrumb" href="/card">
          <svg th:replace="~{fragments/icons :: back}"></svg>
          Back to card management
        </a>
        <div class="page-header page-header-gold">
          <div class="page-header-text">
            <span class="eyebrow">Collection</span>
            <h1>Add New Card</h1>
            <p>Only year, set and player are required &mdash; fill in the rest whenever you know it.</p>
          </div>
        </div>

        <form method="get" th:action="@{/card/saveCard}">
          <div class="filter-panel">
            <div class="filter-grid">
              <div class="filter-field">
                <label for="year"><i class="req">*</i> year</label>
                <input type="text" id="year" name="year" inputmode="numeric" required />
              </div>
              <div class="filter-field">
                <label for="sports">sports</label>
                <input type="text" id="sports" name="sports" />
              </div>
              <div class="filter-field">
                <label for="publisher">publisher</label>
                <input type="text" id="publisher" name="publisher" />
              </div>
              <div class="filter-field">
                <label for="set"><i class="req">*</i> set</label>
                <input type="text" id="set" name="set" required />
              </div>
              <div class="filter-field">
                <label for="player"><i class="req">*</i> player</label>
                <input type="text" id="player" name="player" required />
              </div>
              <div class="filter-field">
                <label for="insert">insert</label>
                <input type="text" id="insert" name="insert" />
              </div>
              <div class="filter-field">
                <label for="parallel">parallel</label>
                <input type="text" id="parallel" name="parallel" />
              </div>
              <div class="filter-field">
                <label for="numbered">numbered</label>
                <input type="text" id="numbered" name="numbered" placeholder="e.g. 12/99" />
              </div>
              <div class="filter-field">
                <label for="grade">grade</label>
                <input type="text" id="grade" name="grade" placeholder="e.g. PSA 10" />
              </div>
              <div class="filter-field">
                <label for="value">value</label>
                <input type="text" id="value" name="value" inputmode="decimal" />
              </div>
              <div class="filter-field">
                <label for="storageId">storage</label>
                <select id="storageId" name="storageId">
                  <option value="">-- none --</option>
                  <option th:each="s : ${storages}" th:value="${s.id}" th:text="${s.name}"></option>
                </select>
              </div>
              <div class="filter-field filter-field-check">
                <input type="checkbox" id="auto" name="auto" />
                <label for="auto">autographed</label>
              </div>
              <div class="filter-field filter-field-wide">
                <label for="note">note</label>
                <textarea id="note" name="note" rows="3"
                  placeholder="Anything worth remembering about this card — condition, where you got it, who it's promised to."></textarea>
              </div>
            </div>
            <div class="filter-actions">
              <button type="submit" class="confirm-butt">Add This Card</button>
              <button type="reset" class="neon-butt">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
