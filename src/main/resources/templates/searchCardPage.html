<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Search Cards</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>
    <script type="text/javascript" th:src="@{/js/util.js}"></script>
    <script>
      $(document).ready(function () {
        $.ajaxSetup({
          beforeSend: function(xhr) {
            xhr.setRequestHeader(
              $('meta[name="_csrf_header"]').attr('content'),
              $('meta[name="_csrf"]').attr('content')
            );
          }
        });

        // Result rows are built here as HTML, so card values have to be
        // escaped before they are interpolated. Also turns null/undefined
        // into "" rather than the string "null".
        var ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        function esc(v) {
          if (v === null || v === undefined) return "";
          return String(v).replace(/[&<>"']/g, function (c) { return ESCAPES[c]; });
        }

        function isBlank(v) {
          return v === null || v === undefined || String(v).trim() === "";
        }

        var SPORT_ICONS = {
          baseball: '<circle cx="12" cy="12" r="9"/><path d="M6.2 5.4c2 2.2 3 4.5 3 6.6s-1 4.4-3 6.6"/><path d="M17.8 5.4c-2 2.2-3 4.5-3 6.6s1 4.4 3 6.6"/>',
          basketball: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3v18"/><path d="M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8"/><path d="M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/>',
          football: '<ellipse cx="12" cy="12" rx="9" ry="5.6" transform="rotate(-30 12 12)"/><path d="M9.2 14.8l5.6-5.6"/>'
        };

        function sportIcon(sports) {
          var key = String(sports || "").toLowerCase();
          var paths = SPORT_ICONS[key] || '<circle cx="12" cy="12" r="9"/>';
          return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">' + paths + '</svg>';
        }

        function rowHtml(card) {
          // Mirrors the server-rendered rows in pagingAllCard.html / allCard.html.
          // Two things getCompLink() in util.js depends on:
          //   - .show-auto must hold literally "true"/"false"; it stays hidden.
          //   - the "raw" placeholder must NOT carry .show-grade, or an ungraded
          //     card would put "raw" into the eBay search.
          var gradeCell = isBlank(card.grade)
            ? '<span class="show rg-none" style="font-size: 0.8rem;">raw</span>'
            : '<span class="show show-grade badge badge-sm badge-info badge-outline">' + esc(card.grade) + '</span>';

          return '<tr class="card-row">' +
            '<td class="rg-cell-id" data-label="id">' +
              '<span class="show show-id rg-num">' + esc(card.id) + '</span>' +
              '<input type="text" class="update-element id" value="' + esc(card.id) + '" disabled />' +
            '</td>' +

            '<td class="rg-cell-card" data-label="card">' +
              '<div class="rg-ident">' +
                sportIcon(card.sports) +
                '<span class="show show-player rg-player">' + esc(card.player) + '</span>' +
                '<span class="show-auto rg-data">' + (card.auto ? "true" : "false") + '</span>' +
                (card.auto ? '<span class="badge badge-sm badge-warning badge-outline">auto</span>' : '') +
                (isBlank(card.sports) ? '' : '<span class="show show-sports badge badge-sm badge-ghost">' + esc(card.sports) + '</span>') +
              '</div>' +
              '<div class="show rg-meta">' +
                '<span class="show-year">' + esc(card.year) + '</span> ' +
                '<span class="rg-sep">·</span> ' +
                '<span class="show-publisher">' + esc(card.publisher) + '</span> ' +
                '<span class="rg-sep">·</span> ' +
                '<span class="show-set">' + esc(card.set) + '</span>' +
              '</div>' +
              (isBlank(card.note) ? '' : '<span class="show show-note rg-note">' + esc(card.note) + '</span>') +
              '<input type="text" class="update-element player" value="' + esc(card.player) + '" placeholder="player" />' +
              '<input type="text" class="update-element year" value="' + esc(card.year) + '" placeholder="year" />' +
              '<input type="text" class="update-element publisher" value="' + esc(card.publisher) + '" placeholder="publisher" />' +
              '<input type="text" class="update-element set" value="' + esc(card.set) + '" placeholder="set" />' +
              '<input type="text" class="update-element sports" value="' + esc(card.sports) + '" placeholder="sports" />' +
              '<label class="update-element rg-auto-field">' +
                '<input type="checkbox" class="auto"' + (card.auto ? ' checked' : '') + ' /> auto' +
              '</label>' +
            '</td>' +

            '<td class="rg-cell-variant" data-label="variant">' +
              '<div class="show rg-variant">' +
                (isBlank(card.insert)
                  ? '<span class="rg-none">base</span>'
                  : '<span class="show-insert">' + esc(card.insert) + '</span>') +
                '<br />' +
                (isBlank(card.parallel)
                  ? '<span class="rg-none">no parallel</span>'
                  : '<span class="show-parallel rg-parallel">' + esc(card.parallel) + '</span>') +
                ' <span class="show-numbered rg-num">' + esc(card.numbered) + '</span>' +
              '</div>' +
              '<input type="text" class="update-element insert" value="' + esc(card.insert) + '" placeholder="insert" />' +
              '<input type="text" class="update-element parallel" value="' + esc(card.parallel) + '" placeholder="parallel" />' +
              '<input type="text" class="update-element numbered" value="' + esc(card.numbered) + '" placeholder="numbered" />' +
            '</td>' +

            '<td class="rg-cell-grade" data-label="grade">' +
              gradeCell +
              '<input type="text" class="update-element grade" value="' + esc(card.grade) + '" placeholder="grade" />' +
            '</td>' +

            '<td class="rg-cell-value" data-label="value" style="text-align: right;">' +
              '<span class="show show-value rg-num" style="font-weight: 700;">' + esc(card.value) + '</span>' +
              '<input type="text" class="update-element value" value="' + esc(card.value) + '" placeholder="value" />' +
            '</td>' +

            '<td class="rg-cell-tags" data-label="tags">' +
              '<span class="show show-tags">' + TagPicker.chipsHtml(card.tags) + '</span>' +
              '<div class="update-element tag-picker" data-selected="' + (card.tags || []).map(function (t) { return t.id; }).join(',') + '"></div>' +
            '</td>' +

            '<td class="rg-cell-actions" data-label="action">' +
              '<div class="rg-actions">' +
                '<button class="show btn btn-xs btn-outline btn-accent modify">modify</button>' +
                '<button class="show btn btn-xs btn-outline btn-accent comps">comps</button>' +
                '<button class="show btn btn-xs btn-outline btn-accent get-tran" onclick="window.location.href=\'/card/cardTransaction/' + esc(card.id) + '\'">transaction</button>' +
                '<button class="show btn btn-xs btn-outline rg-btn-ai potential-btn" data-id="' + esc(card.id) + '">potential</button>' +
                '<button class="update-element btn btn-xs btn-success save">save</button>' +
                '<button class="update-element btn btn-xs btn-outline btn-error cancel">cancel</button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }

        //search card
        function search(){
          $("#result-body .card-row").remove();
          $("#result-empty").hide();

          var formData = {
            id: $("#id").val(),
            year: $("#year").val(),
            sports: $("#sports").val(),
            publisher: $("#publisher").val(),
            set: $("#set").val(),
            player: $("#player").val(),
            auto: $("#auto").is(":checked") ? true : false,
            insert: $("#insert").val(),
            parallel: $("#parallel").val(),
            numbered: $("#numbered").val(),
            grade: $("#grade").val(),
            value: $("#value").val(),
            tagIds: TagPicker.get($("#tag-filter")),
          };

          $.ajax({
            url: "/cardRest/searchCard",
            type: "GET",
            data: formData,
            traditional: true, // tagIds=1&tagIds=2, not tagIds[]=1
            dataType: "json",
            success: function (response) {
              $("#result").show();
              $("#result-count").text(
                response.length === 1 ? "1 card" : response.length + " cards"
              );

              if (response.length === 0) {
                $("#result-table").hide();
                $("#result-empty").show();
                return;
              }

              var resultCards = "";
              response.forEach(function (card) {
                resultCards += rowHtml(card);
              });
              $("#result-body").append(resultCards);
              TagPicker.initAll($("#result-card")[0]);
              $("#result-table").show();
            },
            error: function (xhr, status, error) {
              console.log(error);
              alert("Error occurred while fetching data.");
            },
          });
        }

        $("#search-butt").on("click", function () {
          search();
        });

        //press enter to search
        $(document).on("keypress",function(e){
          if(e.which==13){
            search();
          }
        });

        $("#hide-butt").on("click", function () {
          $("#result").hide();
        });

        //modify card data
        $("#result").on("click", ".modify", function () {
          var row = $(this).closest("tr");
          row.find(".show").hide();
          row.find(".update-element").show();
        });

        $("#result").on("click", ".comps", function () {
          console.log("get comps");
          var row = $(this).closest("tr");
          var link = getCompLink(row);
          window.open(link, "_blank");
        });

        function formatAnalysis(text) {
          var escaped = $("<div>").text(text).html();
          var formatted = escaped.replace(/\*\*Potential Rating:\*\*\s*(Low|Medium|High)/gi, function (match, rating) {
            return "<strong>Potential Rating:</strong> <span class=\"rating-" + rating.toLowerCase() + "\">" + rating + "</span>";
          });
          formatted = formatted.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
          formatted = formatted.replace(/\n/g, "<br>");
          return formatted;
        }

        $("#result").on("click", ".potential-btn", function () {
          var cardId = $(this).data("id");
          $("#potential-modal-body").text("Loading...");
          $("#potential-modal").addClass("modal-open");
          $.ajax({
            url: "/cardRest/" + cardId + "/potential",
            type: "GET",
            success: function (response) {
              var data = typeof response === "string" ? JSON.parse(response) : response;
              $("#potential-modal-body").html(formatAnalysis(data.analysis || data.error || "No response."));
            },
            error: function () {
              $("#potential-modal-body").text("Failed to fetch analysis.");
            },
          });
        });

        $("#potential-modal-close, #potential-modal-backdrop").on("click", function () {
          $("#potential-modal").removeClass("modal-open");
        });

        $("#result").on("click", ".cancel", function () {
          var row = $(this).closest("tr");
          row.find(".show").show();
          row.find(".update-element").hide();
        });

        $("#result").on("click", ".save", function () {
          var row = $(this).closest("tr");

          var cardData = {
            id: row.find(".id").val(),
            year: row.find(".year").val(),
            publisher: row.find(".publisher").val(),
            set: row.find(".set").val(),
            player: row.find(".player").val(),
            auto: row.find(".auto").is(":checked") ? true : false,
            insert: row.find(".insert").val(),
            parallel: row.find(".parallel").val(),
            numbered: row.find(".numbered").val(),
            sports: row.find(".sports").val(),
            grade: row.find(".grade").val(),
            value: row.find(".value").val(),
            tagIds: TagPicker.get(row.find(".tag-picker")),
          };

          var formData = $.param(cardData, true); // traditional: tagIds=1&tagIds=2

          $.ajax({
            url: "/card/updateCard",
            type: "POST",
            // contentType: "application/json",
            data: formData,
            success: function (response) {
              alert("card info updated successfully");
              window.location.href = "/card";
            },
            error: function (error) {
              console.log(error);
              alert("error : " + error);
            },
          });
        });

      });
    </script>

    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <th:block th:replace="~{fragments/tagCell :: assets}"></th:block>
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>

    <!-- AI potential. daisyUI modal, opened by adding .modal-open. -->
    <div id="potential-modal" class="modal">
      <div class="modal-box" style="max-width: 34rem;">
        <h3 style="margin: 0 0 0.75rem; font-size: 1.125rem; font-weight: 900; color: var(--rg-ai); text-shadow: 0 0 10px rgba(246, 76, 189, 0.5);">
          AI Price Rise Potential
        </h3>
        <div id="potential-modal-body" style="line-height: 1.8;">Loading...</div>
        <div class="modal-action">
          <button id="potential-modal-close" class="btn btn-sm btn-outline btn-error">Close</button>
        </div>
      </div>
      <div id="potential-modal-backdrop" class="modal-backdrop"></div>
    </div>

    <div class="rg-page rg-page--wide">

      <div class="rg-page-head">
        <h1>Search Cards</h1>
        <p>填任意欄位就好，空白的欄位會被忽略。按 Enter 也可以直接搜尋。</p>
      </div>

      <div class="rg-panel" id="search">
        <h2 class="rg-panel__title">Criteria</h2>

        <div class="rg-form-grid">
          <label class="rg-field">
            <span class="rg-field__label">player</span>
            <input type="text" id="player" class="input" placeholder="Aaron Judge" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">year</span>
            <input type="text" id="year" class="input" placeholder="2024" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">set</span>
            <input type="text" id="set" class="input" placeholder="Chrome" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">publisher</span>
            <input type="text" id="publisher" class="input" placeholder="Topps" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">sports</span>
            <input type="text" id="sports" class="input" placeholder="Baseball" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">insert</span>
            <input type="text" id="insert" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">parallel</span>
            <input type="text" id="parallel" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">numbered</span>
            <input type="text" id="numbered" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">grade</span>
            <input type="text" id="grade" class="input" placeholder="PSA 10" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">value</span>
            <input type="text" id="value" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">id</span>
            <input type="text" id="id" class="input" />
          </label>
          <div class="rg-field">
            <span class="rg-field__label">tags</span>
            <div class="tag-picker" id="tag-filter"></div>
          </div>
          <label class="rg-check">
            <input type="checkbox" id="auto" class="checkbox checkbox-sm" />
            <span>auto only</span>
          </label>
        </div>

        <div class="rg-form-actions">
          <button id="search-butt" class="btn btn-success">search</button>
          <a href="/card/cards" class="btn btn-ghost">back to cards</a>
        </div>
      </div>

      <div id="result" style="display: none;">
        <div class="rg-result-head">
          <h2>Results</h2>
          <span class="badge badge-secondary badge-outline" id="result-count">0 cards</span>
          <span class="rg-spacer"></span>
          <button id="hide-butt" class="btn btn-sm btn-outline btn-error">clear</button>
        </div>

        <div id="result-empty" class="alert alert-info alert-soft" style="display: none;">
          <span>沒有符合條件的卡片。試著少填幾個欄位。</span>
        </div>

        <div class="rg-table-card" id="result-table">
          <table class="table table-zebra rg-table rg-card-table" id="result-card">
            <thead>
              <tr>
                <th style="width: 3.5rem;">id</th>
                <th>card</th>
                <th style="width: 13rem;">variant</th>
                <th style="width: 6rem;">grade</th>
                <th style="width: 6.5rem; text-align: right;">value</th>
                <th style="width: 11rem;">tags</th>
                <th style="width: 13rem; text-align: right;">action</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </body>
</html>
