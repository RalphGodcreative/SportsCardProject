<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Tags</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <th:block th:replace="~{fragments/head :: styles}"></th:block>
  <script>
    function getCsrf() {
      return {
        token: document.querySelector('meta[name="_csrf"]').getAttribute('content'),
        header: document.querySelector('meta[name="_csrf_header"]').getAttribute('content')
      };
    }

    function addTag() {
      var input = $('#new-tag-name');
      var name = input.val().trim();
      if (!name) { input.trigger('focus'); return; }
      var csrf = getCsrf();
      fetch('/tag/add?name=' + encodeURIComponent(name), {
        method: 'PUT',
        headers: { [csrf.header]: csrf.token }
      })
        .then(res => res.json())
        .then(success => {
          if (success) location.reload();
          else alert('Failed to add tag.');
        });
    }

    var pendingDeleteId = null;

    function openConfirmModal(id) {
      pendingDeleteId = id;
      $('#confirm-modal').addClass('modal-open');
    }

    function closeConfirmModal() {
      pendingDeleteId = null;
      $('#confirm-modal').removeClass('modal-open');
    }

    $(document).ready(function () {
      $('#new-tag-name').on('keydown', function (e) {
        if (e.key === 'Enter') addTag();
      });

      $('.delete-tag').on('click', function () {
        openConfirmModal($(this).data('id'));
      });

      $('#confirm-modal-cancel').on('click', closeConfirmModal);
      $('#confirm-modal').on('click', function (e) {
        if (e.target.id === 'confirm-modal') closeConfirmModal();
      });

      $('#confirm-modal-delete').on('click', function () {
        if (pendingDeleteId == null) return;
        var csrf = getCsrf();
        fetch('/tag/delete?tagId=' + pendingDeleteId, {
          method: 'DELETE',
          headers: { [csrf.header]: csrf.token }
        })
          .then(res => res.json())
          .then(success => {
            if (success) location.reload();
            else { alert('Something went wrong.'); closeConfirmModal(); }
          });
      });

      $('.edit-tag').on('click', function () {
        var card = $(this).closest('.tag-card');
        card.find('.view-mode').hide();
        card.find('.edit-mode').show();
        card.find('.tag-name-view').hide();
        card.find('.tag-name-edit').show().find('input').trigger('focus').trigger('select');
      });

      $('.cancel-edit').on('click', function () {
        var card = $(this).closest('.tag-card');
        card.find('.edit-mode').hide();
        card.find('.view-mode').show();
        card.find('.tag-name-edit').hide();
        card.find('.tag-name-view').show();
      });

      $('.save-tag').on('click', function () {
        var card = $(this).closest('.tag-card');
        var id = card.data('id');
        var name = card.find('.tag-name-edit input').val().trim();
        if (!name) return;
        var csrf = getCsrf();
        fetch('/tag/rename?tagId=' + id + '&name=' + encodeURIComponent(name), {
          method: 'PUT',
          headers: { [csrf.header]: csrf.token }
        })
          .then(res => res.json())
          .then(success => {
            if (success) location.reload();
            else alert('Failed to rename tag.');
          });
      });
    });
  </script>
</head>
<body>
  <div th:replace="~{banner.html :: header}"></div>

  <!-- Delete confirmation. The click handler closes on a hit to #confirm-modal
       itself, which is the area outside .modal-box. -->
  <div id="confirm-modal" class="modal">
    <div class="modal-box" style="max-width: 26rem;">
      <h3 style="margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 900;">Delete this tag?</h3>
      <p style="margin: 0; font-size: 0.875rem; color: var(--rg-muted);">
        Cards carrying it won't be deleted &mdash; they'll just lose this tag.
      </p>
      <div class="modal-action">
        <button id="confirm-modal-cancel" class="btn btn-sm btn-ghost">Cancel</button>
        <button id="confirm-modal-delete" class="btn btn-sm btn-error">Delete</button>
      </div>
    </div>
  </div>

  <div class="rg-page">

    <div class="rg-page-head">
      <span class="badge badge-secondary badge-outline" style="margin-bottom: 0.5rem;">Collection</span>
      <h1>Tags</h1>
      <p>自訂標籤 方便管理 &mdash; 存放位置、隊伍、特殊標記等，一張卡可以有多個標籤。</p>
    </div>

    <div class="rg-stat-row" style="margin-bottom: 1.5rem;">
      <div class="rg-stat-pill">
        <strong th:text="${#lists.size(tags)}">0</strong>
        <span>tags</span>
      </div>
      <div class="rg-stat-pill">
        <strong th:text="${totalTagged}">0</strong>
        <span>cards tagged</span>
      </div>
    </div>

    <div class="rg-panel rg-panel--plain" style="margin-bottom: 1.5rem;">
      <h2 class="rg-panel__title">New tag</h2>
      <div class="join">
        <input type="text" id="new-tag-name" class="input join-item" placeholder="New tag name" maxlength="100" />
        <button class="btn btn-success join-item" onclick="addTag()">Add tag</button>
      </div>
    </div>

    <div class="alert alert-info alert-soft" th:if="${#lists.isEmpty(tags)}">
      <span><strong>No tags yet.</strong> Create your first tag above to start organizing your collection.</span>
    </div>

    <div class="rg-grid" th:unless="${#lists.isEmpty(tags)}">
      <div class="rg-tile tag-card" th:each="tag : ${tags}" th:data-id="${tag.id}">

        <div class="rg-tile__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3zM6 6h.008v.008H6V6z" />
          </svg>
        </div>

        <div>
          <span class="tag-name-view rg-tile__name" th:text="${tag.name}">tag</span>
          <span class="tag-name-edit" style="display:none;">
            <input type="text" class="input input-sm" style="width: 100%;" th:value="${tag.name}" maxlength="100" />
          </span>
          <div class="rg-tile__meta">
            <strong th:text="${cardCounts.get(tag.id)}">0</strong><span th:text="${cardCounts.get(tag.id) == 1 ? ' card' : ' cards'}"> cards</span>
          </div>
        </div>

        <div class="rg-tile__actions view-mode">
          <button class="btn btn-sm btn-outline btn-accent view-cards"
                  th:onclick="'window.location.href=\'/tag/' + ${tag.id} + '/cards\''">View cards</button>
          <span class="rg-spacer"></span>
          <button class="btn btn-sm btn-ghost edit-tag" aria-label="Rename tag" title="Rename">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931z" />
            </svg>
          </button>
          <button class="btn btn-sm btn-ghost delete-tag" style="color: var(--color-error);" th:data-id="${tag.id}" aria-label="Delete tag" title="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.772 5.79a48.1 48.1 0 013.478-.397m7.5 0a48.1 48.1 0 013.478.397M4.772 5.79L5.84 19.673a2.25 2.25 0 002.244 2.077h7.832a2.25 2.25 0 002.244-2.077L19.228 5.79M9.26 9l.346 9m4.788-9l-.346 9M15.75 5.393v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916" />
            </svg>
          </button>
        </div>

        <div class="rg-tile__actions edit-mode" style="display:none;">
          <button class="btn btn-sm btn-success save-tag">Save</button>
          <button class="btn btn-sm btn-ghost cancel-edit">Cancel</button>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
