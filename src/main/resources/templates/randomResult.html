<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Result</title>

    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script th:inline="javascript">
      $(document).ready(function(){

      var list = [[${randomList}]];
      console.log(list);
      $('#itemLength').text(list.length);

      });

    </script>

    <th:block th:replace="~{fragments/head :: styles}"></th:block>
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>

    <div class="rg-page" style="max-width: 40rem;">

      <div class="rg-page-head">
        <h1>Result</h1>
        <p>
          <span id="itemCount">you have <span id="itemLength">0</span> items</span>
          &middot;
          randomized <span style="color: var(--color-accent); font-weight: 700; text-shadow: 0 0 10px rgba(49, 246, 181, 0.6);">[[${randomTimes}]]</span> times
        </p>
      </div>

      <div class="rg-table-card" id="result-list">
        <table class="table table-zebra rg-table">
          <tbody>
            <tr class="result-item" th:each="value,status:${randomList}">
              <td class="rg-num" style="width: 3.5rem; color: var(--rg-dim);">[[${status.count}]]</td>
              <td>[[${value}]]</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="rg-form-actions">
        <form method="post" th:action="@{/randomize}" style="margin: 0;">
          <textarea style="display: none" th:name="nameList">[[${nameList}]]</textarea>
          <input type="hidden" th:name="randomTimes" th:value="${randomTimes}" />
          <button type="submit" class="btn btn-success">Randomize again</button>
        </form>
        <a href="/random" class="btn btn-ghost">Return</a>
      </div>

    </div>
  </body>
</html>
