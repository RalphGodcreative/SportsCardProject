<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Product Searching Result</title>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <th:block th:replace="~{fragments/head :: styles}"></th:block>

</head>

<body>
  <div th:replace="~{banner.html :: header}"></div>

  <div class="rg-page rg-page--wide">

    <div class="rg-page-head">
      <h1>Search result</h1>
      <p>每個關鍵字目前在 Yahoo 拍賣搜到的商品。</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="rg-panel rg-panel--plain" th:each="entry: ${resultList}">
        <h2 class="rg-panel__title" style="color: var(--color-secondary);" th:text="${entry.key.keyword}"></h2>

        <div class="rg-grid">
          <a class="rg-tile product-link" th:each="product : ${entry.value}"
             th:href="${product.link}" target="_blank" rel="noopener"
             style="align-items: center; text-align: center;">
            <img class="product-image" th:src="${product.image}" alt=""
                 style="max-width: 150px; border-radius: var(--radius-field);" />
            <span style="font-size: 0.875rem; line-height: 1.5;" th:text="${product.title}"></span>
            <span class="product-price" style="font-weight: 700; color: #fbbf24; text-shadow: 0 0 6px rgba(251, 191, 36, 0.4);">
              $ <span th:text="${product.price}"></span>
            </span>
            <span th:if="${product.onAuction}" class="badge badge-sm badge-ghost" th:text="${product.timeLeft}"></span>
          </a>
        </div>
      </div>
    </div>

  </div>
</body>

</html>
