<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>All Transactions</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>
    <script type="text/javascript">
      $(document).ready(function () {
        var transactionCounts = $("#transaction-counts").val();
        var currentPage = $("#current-page").val();
        var totalPages = Math.floor(transactionCounts / 10);
        if (transactionCounts % 10 > 0) {
          totalPages++;
        }

        for (let i = 1; i <= totalPages; i++) {
          let cls = "index join-item btn btn-sm";
          if (i == currentPage) {
            cls += " btn-active current-index";
          }
          $("#page-index").append(
            '<a class="' + cls + '" href="/transactions/?page=' + i + '">' + i + '</a>'
          );
        }

        $("#first-page").on("click", function () {
          if (currentPage != 1) window.location.href = "/transactions/?page=1";
        });
        $("#last-page").on("click", function () {
          if (currentPage != totalPages) window.location.href = "/transactions/?page=" + totalPages;
        });
        $("#prev-page").on("click", function () {
          if (currentPage != 1) window.location.href = "/transactions/?page=" + (parseInt(currentPage) - 1);
        });
        $("#next-page").on("click", function () {
          if (currentPage != totalPages) window.location.href = "/transactions/?page=" + (parseInt(currentPage) + 1);
        });
      });
    </script>

    <th:block th:replace="~{fragments/head :: styles}"></th:block>
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>

    <div class="rg-page">

      <div class="rg-page-head">
        <h1>Transactions</h1>
        <p>所有買入與賣出紀錄。點任一列可以看該筆交易的細節。</p>
      </div>

      <div class="rg-toolbar">
        <div class="rg-quota">
          <div class="rg-quota__count">
            <strong th:text="${transactionCounts}">0</strong>
            <span>transactions</span>
          </div>
        </div>
        <span class="rg-spacer"></span>
        <a href="/card/addTransaction" class="btn btn-sm btn-outline btn-accent">add transaction</a>
        <a href="/card/sellTransaction" class="btn btn-sm btn-outline btn-accent">add sales</a>
      </div>

      <div class="rg-table-card">
        <table class="table table-zebra rg-table" id="contain-table">
          <thead>
            <tr>
              <th style="width: 5rem;">id</th>
              <th style="width: 12rem;">date</th>
              <th style="width: 8rem;">type</th>
              <th style="text-align: right;">amount</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="tran : ${transactions}" class="transaction-row"
                style="cursor: pointer;"
                th:onclick="'location.href=\'/transactions/' + ${tran.id} + '\''">
              <td class="rg-num" style="color: var(--rg-dim);">[[${tran.id}]]</td>
              <td class="rg-num">[[${tran.date}]]</td>
              <td><span class="badge badge-sm badge-ghost">[[${tran.type}]]</span></td>
              <td class="rg-num" style="text-align: right; font-weight: 700;">[[${tran.amount}]]</td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}">
              <td colspan="4" style="text-align: center; padding: 2.5rem 1rem; color: var(--rg-dim);">
                還沒有交易紀錄。<a href="/card/addTransaction" class="link link-primary">新增第一筆</a>。
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="rg-pager">
        <span class="rg-spacer"></span>
        <div class="join" id="page-control">
          <button class="join-item btn btn-sm" id="first-page">&lt;&lt;</button>
          <button class="join-item btn btn-sm" id="prev-page">&lt;</button>
          <span id="page-index" style="display: contents;"></span>
          <button class="join-item btn btn-sm" id="next-page">&gt;</button>
          <button class="join-item btn btn-sm" id="last-page">&gt;&gt;</button>
        </div>
      </div>

      <input type="hidden" id="transaction-counts" th:value="${transactionCounts}" />
      <input type="hidden" id="current-page" th:value="${page}" />

    </div>
  </body>
</html>
