<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>All Transactions</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>
    <script type="text/javascript">
      $(document).ready(function () {
        var transactionCounts = $("#transaction-counts").val();
        var currentPage = $("#current-page").val();
        var totalPages = Math.floor(transactionCounts / 10);
        if (transactionCounts % 10 > 0) {
          totalPages++;
        }

        for (let i = 1; i <= totalPages; i++) {
          let index;
          if (i == currentPage) {
            index = `<a class="index current-index" href="/transactions/?page=${i}">${i}</a>`;
          } else {
            index = `<a class="index" href="/transactions/?page=${i}">${i}</a>`;
          }
          $("#page-index").append(index);
        }

        $("#first-page").on("click", function () {
          if (currentPage != 1) window.location.href = "/transactions/?page=1";
        });
        $("#last-page").on("click", function () {
          if (currentPage != totalPages) window.location.href = "/transactions/?page=" + totalPages;
        });
        $("#prev-page").on("click", function () {
          if (currentPage != 1) window.location.href = "/transactions/?page=" + (parseInt(currentPage) - 1);
        });
        $("#next-page").on("click", function () {
          if (currentPage != totalPages) window.location.href = "/transactions/?page=" + (parseInt(currentPage) + 1);
        });
      });
    </script>

    <style>
      #contain-table table,
      tr,
      td,
      th {
        border-collapse: collapse;
        border: 1px solid rgba(202, 71, 245, 0.2);
        color: #e2e8f0;
      }
      #contain-table {
        background-color: #12121a;
        box-shadow: 0 0 20px rgba(202, 71, 245, 0.05);
      }
      #contain-table th {
        background: linear-gradient(45deg, rgba(124, 58, 237, 0.5), rgba(202, 71, 245, 0.3));
        text-shadow: 0 0 8px rgba(202, 71, 245, 0.4);
      }
      #contain-table td{
        padding-left: 5px;
        padding-right: 5px;
      }

      .transaction-row{
        cursor: pointer;
      }
      .transaction-row:hover{
        background-color: rgba(202, 71, 245, 0.08);
      }

    </style>
    <link rel="stylesheet" th:href="@{/assets/style.css}" />
    <link rel="stylesheet" th:href="@{/assets/card-pages.css}" />
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>
    <div class="page-top">
      <div class="center-div" id="contain-table">
        <div class="center-div" id="page-control">
          <button class="page-butt" id="first-page">&lt;&lt;</button>
          <button class="page-butt" id="prev-page">&lt;</button>
          <span id="page-index"></span>
          <button class="page-butt" id="next-page">&gt;</button>
          <button class="page-butt" id="last-page">&gt;&gt;</button>
        </div>
        <div class="table-center">
        <table>
          <tr>
            <th>id</th>
            <th>date</th>
            <th>type</th>
            <th>amount</th>
          </tr>
          <tr th:each="tran : ${transactions}" class="transaction-row" th:onclick="'location.href=\'/transactions/' + ${tran.id} + '\''">
            <td>[[${tran.id}]]</td>
            <td>[[${tran.date}]]</td>
            <td>[[${tran.type}]]</td>
            <td>[[${tran.amount}]]</td>
          </tr>
        </table>
        </div>
        <input type="hidden" id="transaction-counts" th:value="${transactionCounts}" />
        <input type="hidden" id="current-page" th:value="${page}" />
      </div>
    </div>
  </body>
</html>
