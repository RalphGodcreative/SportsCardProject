<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <th:block th:replace="~{fragments/head :: styles}"></th:block>
</head>
<body>
  <div class="rg-auth-page">
    <div class="rg-auth-card">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 0.875rem; margin-bottom: 1.75rem;">
        <img th:src="@{/img/RGForBanner.png}" alt="RG Sports Cards" style="width: 92px; height: 63px; display: block;" />
        <div style="text-align: center;">
          <h1 style="margin: 0 0 0.375rem; font-size: 1.375rem; font-weight: 900;">Create account</h1>
          <p style="margin: 0; font-size: 0.875rem; color: var(--rg-muted);">開始紀錄你的球員卡收藏</p>
        </div>
      </div>

      <div th:if="${error}" class="alert alert-error alert-soft" style="margin-bottom: 1rem;">
        <span th:text="${error}"></span>
      </div>

      <form id="register-form" th:action="@{/register}" method="post">
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <label class="rg-field">
            <span class="rg-field__label">Email</span>
            <input type="email" id="email" name="email" class="input" required autofocus autocomplete="email" />
          </label>

          <label class="rg-field">
            <span class="rg-field__label">Username</span>
            <input type="text" id="username" name="username" class="input" required autocomplete="username" />
          </label>

          <label class="rg-field">
            <span class="rg-field__label">Password</span>
            <input type="password" id="password" name="password" class="input" required autocomplete="new-password"
                   minlength="8" pattern="^(?=.*[a-zA-Z])(?=.*[0-9]).{8,}$"
                   title="At least 8 characters, including 1 letter and 1 number" />
          </label>

          <div style="display: flex; flex-direction: column; gap: 0.25rem; margin-top: -0.5rem;">
            <div class="rg-pwd-rule" id="rule-length">&#10007; At least 8 characters</div>
            <div class="rg-pwd-rule" id="rule-letter">&#10007; At least 1 letter</div>
            <div class="rg-pwd-rule" id="rule-number">&#10007; At least 1 number</div>
          </div>

          <label class="rg-field">
            <span class="rg-field__label">Confirm password</span>
            <input type="password" id="confirm" class="input" required autocomplete="new-password" />
          </label>
          <p id="confirm-error" style="display: none; margin: -0.5rem 0 0; font-size: 0.8125rem; color: var(--color-error);">
            Passwords do not match.
          </p>

          <button type="submit" class="btn btn-success" style="width: 100%;">Create Account</button>
        </div>
      </form>

      <p class="rg-auth-msg">
        Already have an account? <a href="/login" class="link link-primary">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    var form = document.getElementById('register-form');
    var password = document.getElementById('password');
    var confirm = document.getElementById('confirm');
    var confirmError = document.getElementById('confirm-error');
    var ruleLength = document.getElementById('rule-length');
    var ruleLetter = document.getElementById('rule-letter');
    var ruleNumber = document.getElementById('rule-number');

    function setRule(el, met, passText, failText) {
      el.textContent = (met ? '✓ ' : '✗ ') + (met ? passText : failText);
      el.classList.toggle('met', met);
    }

    password.addEventListener('input', function () {
      var val = password.value;
      setRule(ruleLength, val.length >= 8, 'At least 8 characters', 'At least 8 characters');
      setRule(ruleLetter, /[a-zA-Z]/.test(val), 'At least 1 letter', 'At least 1 letter');
      setRule(ruleNumber, /[0-9]/.test(val), 'At least 1 number', 'At least 1 number');
    });

    confirm.addEventListener('input', function () {
      if (confirm.value && confirm.value !== password.value) {
        confirmError.style.display = 'block';
        confirm.setCustomValidity('Passwords do not match.');
      } else {
        confirmError.style.display = 'none';
        confirm.setCustomValidity('');
      }
    });

    form.addEventListener('submit', function (e) {
      if (password.value !== confirm.value) {
        e.preventDefault();
        confirmError.style.display = 'block';
        confirm.setCustomValidity('Passwords do not match.');
      }
    });
  </script>
</body>
</html>
