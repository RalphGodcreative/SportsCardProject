<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <title>Cards</title>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <script type="text/javascript" th:src="@{/js/util.js}"></script>
  <script>
    $(document).ready(function () {
      $.ajaxSetup({
        beforeSend: function(xhr) {
          xhr.setRequestHeader(
            $('meta[name="_csrf_header"]').attr('content'),
            $('meta[name="_csrf"]').attr('content')
          );
        }
      });

      $(".modify").on("click", function () {
        var row = $(this).closest("tr");
        row.find(".show").hide();
        row.find(".update-element").show();
      });

      $(".comps").on("click", function () {
        var row = $(this).closest("tr");
        var link = getCompLink(row);
        window.open(link, "_blank");
      });

      $(".cancel").on("click", function () {
        var row = $(this).closest("tr");
        row.find(".show").show();
        row.find(".update-element").hide();
      });

      $(".save").on("click", function () {
        var row = $(this).closest("tr");

        var cardData = {
          id: row.find(".id").val(),
          year: row.find(".year").val(),
          publisher: row.find(".publisher").val(),
          set: row.find(".set").val(),
          player: row.find(".player").val(),
          auto: row.find(".auto").is(":checked") ? true : false,
          insert: row.find(".insert").val(),
          parallel: row.find(".parallel").val(),
          numbered: row.find(".numbered").val(),
          sports: row.find(".sports").val(),
          grade: row.find(".grade").val(),
          value: row.find(".value").val(),
          tagIds: TagPicker.get(row.find(".tag-picker")),
        };

        var formData = $.param(cardData, true); // traditional: tagIds=1&tagIds=2

        $.ajax({
          url: "/card/updateCard",
          type: "POST",
          // contentType: "application/json",
          data: formData,
          success: function (response) {
            alert("card info updated successfully");
            window.location.href = "/card";
          },
          error: function (error) {
            console.log(error);
            alert("error : " + error);
          },
        });
      });

    });
  </script>

  <th:block th:replace="~{fragments/head :: styles}"></th:block>
  <th:block th:replace="~{fragments/tagCell :: assets}"></th:block>
</head>

<body>
  <div th:replace="~{banner.html :: header}"></div>

  <div class="rg-page">

    <div class="rg-page-head">
      <h1>Card Management</h1>
      <p>收藏的入口頁。下面是你最近新增的一張卡片。</p>
    </div>

    <div class="rg-grid" style="margin-bottom: 1.75rem;">
      <a href="/card/addNewCard" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">Add new card</span>
        <span class="rg-tile__meta">新增一張卡片到收藏</span>
      </a>
      <a href="/card/cards" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">See cards</span>
        <span class="rg-tile__meta">分頁瀏覽整個收藏</span>
      </a>
      <a href="/card/searchCard" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">Search cards</span>
        <span class="rg-tile__meta">依球員、系列、鑑定分數搜尋</span>
      </a>
      <a href="/card/addTransaction" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">Add transaction</span>
        <span class="rg-tile__meta">記錄一筆買入</span>
      </a>
      <a href="/card/sellTransaction" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">Add sales</span>
        <span class="rg-tile__meta">記錄一筆賣出</span>
      </a>
      <a href="/transactions/" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">View transactions</span>
        <span class="rg-tile__meta">買賣紀錄與損益</span>
      </a>
      <a href="/tag" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">Manage tags</span>
        <span class="rg-tile__meta">自訂標籤，分類收藏</span>
      </a>
      <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/card/allCard" class="rg-tile" style="gap: 0.375rem;">
        <span class="rg-tile__name">See all cards <span class="badge badge-sm badge-secondary">admin</span></span>
        <span class="rg-tile__meta">不分頁，一次顯示全部</span>
      </a>
    </div>

    <h2 style="margin: 0 0 0.875rem; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rg-dim);">
      The latest card
    </h2>

    <div th:if="${lastCard == null}" class="alert alert-info alert-soft">
      <span>還沒有任何卡片。<a href="/card/addNewCard" class="link link-primary">新增第一張卡片</a>。</span>
    </div>

    <div th:if="${lastCard != null}" class="rg-table-card">
      <table class="table table-zebra rg-table rg-card-table" id="last-card">
        <thead>
          <tr>
            <th:block th:replace="~{fragments/cardRow :: headers}"></th:block>
            <th>tags</th>
            <th>action</th>
          </tr>
        </thead>
        <tbody>
          <tr>

            <th:block th:replace="~{fragments/cardRow :: cells(${lastCard})}"></th:block>

            <td th:replace="~{fragments/tagCell :: cell(${lastCard})}"></td>

            <td class="rg-cell-actions" data-label="action">
              <div class="rg-actions">
                <button class="show btn btn-xs btn-outline btn-accent modify">modify</button>
                <button class="show btn btn-xs btn-outline btn-accent comps">comps</button>
                <button class="show btn btn-xs btn-outline btn-accent get-tran"
                        th:onclick="'window.location.href=\'/card/cardTransaction/' + ${lastCard.id} + '\''">
                  transaction
                </button>
                <button class="update-element btn btn-xs btn-success save">save</button>
                <button class="update-element btn btn-xs btn-outline btn-error cancel">cancel</button>
              </div>
            </td>

          </tr>
        </tbody>
      </table>
    </div>

  </div>
</body>

</html>
