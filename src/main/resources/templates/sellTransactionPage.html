<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Add Sales</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <script
      type="text/javascript"
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"
    ></script>
    <script>
      $(document).ready(function () {
        $.ajaxSetup({
          beforeSend: function(xhr) {
            xhr.setRequestHeader(
              $('meta[name="_csrf_header"]').attr('content'),
              $('meta[name="_csrf"]').attr('content')
            );
          }
        });

        var cardIds = [];

        // Result rows are built as HTML, so values are escaped before being
        // interpolated. Also maps null/undefined to "" — createCardInfo()
        // tests fields against "", so a literal "null" would end up in the
        // summary line.
        var ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
        function esc(v) {
          if (v === null || v === undefined) return "";
          return String(v).replace(/[&<>"']/g, function (c) { return ESCAPES[c]; });
        }

        function saveTransaction() {

          var transaction = {
            date: $("#date").val(),
            type: $("#type").val(),
            amount: $("#amount").val(),
            // There was no note element on this page at all, so this read
            // undefined and no sale ever carried a note.
            note: $("#note-text").val(),
          };

          if (
            transaction.date == "" ||
            null ||
            transaction.type == "" ||
            null ||
            transaction.amount == "" ||
            null
          ) {
            alert("unfilled necessary column");
            return;
          }

          var saleWithCard = {
            transaction: transaction,
            cardIds: cardIds,
          };

          $.ajax({
            url: "/card/saveSale",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(saleWithCard),
            success: function (response) {
              alert("sale added successfully");
              window.location.href = "/card";
            },
            error: function (error) {
              alert("error : " + error);
            },
          });
        }

        function refreshIncludedCount() {
          $("#included-count").text(
            cardIds.length === 1 ? "1 card" : cardIds.length + " cards"
          );
          $("#included-empty").toggle(cardIds.length === 0);
        }

        $("#add-transaction").on("click", function () {
          if(cardIds.length==0){
            alert("no card added");
            return;
          }
          saveTransaction();
        });

        //delete included card
        $("#include-card").on("click", ".remove", function () {
          var row = $(this).closest("tr");
          let i = cardIds.indexOf(row.find(".card-id").text());
          cardIds.splice(i, 1);
          row.remove();
          refreshIncludedCount();
        });

        //show included card info
        $("#include-card").on("click", ".show-card", function () {
          var row = $(this).closest("tr");
          row.find(".info").show();
          row.find(".hide-card").show();
          row.find(".show-card").hide();
        });

        //hide included card info
        $("#include-card").on("click", ".hide-card", function () {
          var row = $(this).closest("tr");
          row.find(".info").hide();
          row.find(".hide-card").hide();
          row.find(".show-card").show();
        });

        //add card into sale
        $("#result").on("click", ".add-card", function () {
          var row = $(this).closest("tr");

          var cardData = {
            id: row.find(".id").text(),
            year: row.find(".year").text(),
            publisher: row.find(".publisher").text(),
            set: row.find(".set").text(),
            player: row.find(".player").text(),
            auto: row.find(".auto").text() == "true" ? true : false,
            insert: row.find(".insert").text(),
            parallel: row.find(".parallel").text(),
            numbered: row.find(".numbered").text(),
            sports: row.find(".sports").text(),
            grade: row.find(".grade").text(),
            value: row.find(".value").text(),
          };

          if (cardIds.includes(cardData.id)) {
            alert("card already added");
            return;
          }
          cardIds.push(cardData.id);

          var info = createCardInfo(cardData);

          var includedCard = `
          <tr>
            <td data-label="card id"><span class="card-id rg-num">${esc(cardData.id)}</span></td>
            <td data-label="info">
              <span class="info" style="display:none;">${esc(info)}</span>
              <button class="btn btn-xs btn-outline btn-accent show-card">show</button>
              <button class="btn btn-xs btn-outline btn-accent hide-card" style="display:none;">hide</button>
            </td>
            <td data-label="action" style="text-align: right;">
              <button class="remove btn btn-xs btn-outline btn-error">remove</button>
            </td>
          </tr>
          `;

          $("#include-card tbody").append(includedCard);
          refreshIncludedCount();
        });

        $("#search-butt").on("click", function () {
          $("#result").hide();
          $("#result-body .card-row").remove();

          var formData = {
            id: $("#id").val(),
            year: $("#year").val(),
            sports: $("#sports").val(),
            publisher: $("#publisher").val(),
            set: $("#set").val(),
            player: $("#player").val(),
            auto: $("#auto").is(":checked") ? true : false,
            insert: $("#insert").val(),
            parallel: $("#parallel").val(),
            numbered: $("#numbered").val(),
            grade: $("#grade").val(),
            value: $("#value").val(),
            tagIds: TagPicker.get($("#tag-filter")),
          };

          $.ajax({
            url: "/cardRest/searchCard",
            type: "GET",
            data: formData,
            traditional: true, // tagIds=1&tagIds=2, not tagIds[]=1
            dataType: "json",
            success: function (response) {
              $("#result").show();
              $("#result-count").text(
                response.length === 1 ? "1 card" : response.length + " cards"
              );

              if (response.length === 0) {
                $("#result-table").hide();
                $("#result-empty").show();
                return;
              }
              $("#result-empty").hide();

              var resultCards = "";
              response.forEach(function (card) {
                // .add-card reads these back with .text(), so every field the
                // handler wants keeps its own element: .auto must read exactly
                // "true"/"false", and .numbered is split on "/".
                resultCards += '<tr class="card-row">' +
                  '<td data-label="id"><span class="id rg-num">' + esc(card.id) + '</span></td>' +
                  '<td data-label="year"><span class="year rg-num">' + esc(card.year) + '</span></td>' +
                  '<td data-label="sports"><span class="sports">' + esc(card.sports) + '</span></td>' +
                  '<td data-label="publisher"><span class="publisher">' + esc(card.publisher) + '</span></td>' +
                  '<td data-label="set"><span class="set">' + esc(card.set) + '</span></td>' +
                  '<td data-label="player"><span class="player rg-player">' + esc(card.player) + '</span></td>' +
                  '<td data-label="auto"><span class="auto">' + (card.auto ? "true" : "false") + '</span></td>' +
                  '<td data-label="insert"><span class="insert">' + esc(card.insert) + '</span></td>' +
                  '<td data-label="parallel"><span class="parallel">' + esc(card.parallel) + '</span></td>' +
                  '<td data-label="numbered"><span class="numbered rg-num">' + esc(card.numbered) + '</span></td>' +
                  '<td data-label="grade"><span class="grade">' + esc(card.grade) + '</span></td>' +
                  '<td data-label="value"><span class="value rg-num">' + esc(card.value) + '</span></td>' +
                  '<td data-label="tags"><span class="tags">' + TagPicker.chipsHtml(card.tags) + '</span></td>' +
                  '<td class="rg-cell-actions" data-label="action">' +
                    '<div class="rg-actions"><button class="btn btn-xs btn-success add-card">add to sale</button></div>' +
                  '</td>' +
                '</tr>';
              });
              $("#result-body").append(resultCards);
              $("#result-table").show();
            },
            error: function (xhr, status, error) {
              console.log(error);
              alert("Error occurred while fetching data.");
            },
          });
        });

        $("#hide-butt").on("click", function () {
          $("#result").hide();
        });

        //create short card info
        function createCardInfo(cardData) {
          var info = "";
          if (cardData.year != "") {
            info += cardData.year;
            info += " ";
          }
          if (cardData.publisher != "") {
            info += cardData.publisher;
            info += " ";
          }
          if (cardData.set != "") {
            info += cardData.set;
            info += " ";
          }
          if (cardData.player != "") {
            info += cardData.player;
            info += " ";
          }
          if (cardData.insert != "") {
            info += cardData.insert;
            info += " ";
          }
          if (cardData.parallel != "") {
            info += cardData.parallel;
            info += " ";
          }
          if (cardData.auto) {
            info += "auto";
            info += " ";
          }
          if (cardData.numbered != "") {
            let num = cardData.numbered.split("/");
            let deno = num[1];
            info += "/";
            info += deno;
            info += " ";
          }
          if (cardData.grade) {
            info += cardData.grade;
            info += " ";
          }
          return info;
        }

        refreshIncludedCount();

        //end of ready
      });
    </script>

    <th:block th:replace="~{fragments/head :: styles}"></th:block>
    <th:block th:replace="~{fragments/tagCell :: assets}"></th:block>
  </head>
  <body>
    <div th:replace="~{banner.html :: header}"></div>

    <div class="rg-page rg-page--wide">

      <div class="rg-page-head">
        <h1>Add new sale</h1>
        <p>記錄一筆賣出。先填交易資料，再從下方搜尋並加入這筆交易賣掉的卡片。</p>
      </div>

      <div class="rg-panel" id="add-tran" style="margin-bottom: 1.25rem;">
        <h2 class="rg-panel__title">Transaction</h2>
        <div class="rg-form-grid">
          <label class="rg-field">
            <span class="rg-field__label">date <span style="color: var(--rg-pink);">*</span></span>
            <input type="date" id="date" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">type <span style="color: var(--rg-pink);">*</span></span>
            <select id="type" class="select">
              <option value="Sell">Sell</option>
              <option value="Trade">Trade</option>
            </select>
          </label>
          <label class="rg-field">
            <span class="rg-field__label">amount <span style="color: var(--rg-pink);">*</span></span>
            <input type="text" id="amount" class="input" placeholder="整筆交易總金額" />
          </label>
          <label class="rg-field" style="grid-column: 1 / -1;">
            <span class="rg-field__label">note</span>
            <textarea id="note-text" name="note" class="textarea" rows="2" style="width: 100%;"></textarea>
          </label>
        </div>
      </div>

      <div class="rg-toolbar">
        <span style="font-size: 0.875rem; color: var(--rg-muted);">這筆交易賣掉的卡片</span>
        <span class="badge badge-secondary badge-outline" id="included-count">0 cards</span>
        <span class="rg-spacer"></span>
        <button id="add-transaction" class="btn btn-sm btn-success">Add Transaction</button>
      </div>

      <div id="included-empty" class="alert alert-info alert-soft" style="margin-bottom: 1.25rem;">
        <span>還沒有加入任何卡片。用下面的搜尋找到卡片後按 <strong>add to sale</strong>。</span>
      </div>

      <div class="rg-table-card" id="include" style="margin-bottom: 2rem;">
        <table id="include-card" class="table table-zebra rg-table rg-card-table">
          <thead>
            <tr>
              <th style="width: 6rem;">card id</th>
              <th>info</th>
              <th style="width: 9rem; text-align: right;">action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="rg-panel" id="search">
        <h2 class="rg-panel__title">Find cards to sell</h2>
        <div class="rg-form-grid">
          <label class="rg-field">
            <span class="rg-field__label">player</span>
            <input type="text" id="player" class="input" placeholder="Aaron Judge" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">year</span>
            <input type="text" id="year" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">set</span>
            <input type="text" id="set" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">publisher</span>
            <input type="text" id="publisher" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">sports</span>
            <input type="text" id="sports" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">insert</span>
            <input type="text" id="insert" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">parallel</span>
            <input type="text" id="parallel" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">numbered</span>
            <input type="text" id="numbered" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">grade</span>
            <input type="text" id="grade" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">value</span>
            <input type="text" id="value" class="input" />
          </label>
          <label class="rg-field">
            <span class="rg-field__label">id</span>
            <input type="text" id="id" class="input" />
          </label>
          <div class="rg-field">
            <span class="rg-field__label">tags</span>
            <div class="tag-picker" id="tag-filter"></div>
          </div>
          <label class="rg-check">
            <input type="checkbox" id="auto" class="checkbox checkbox-sm" />
            <span>auto only</span>
          </label>
        </div>
        <div class="rg-form-actions">
          <button id="search-butt" class="btn btn-success">search</button>
        </div>
      </div>

      <div id="result" style="display: none;">
        <div class="rg-result-head">
          <h2>Results</h2>
          <span class="badge badge-secondary badge-outline" id="result-count">0 cards</span>
          <span class="rg-spacer"></span>
          <button id="hide-butt" class="btn btn-sm btn-outline btn-error">clear</button>
        </div>

        <div id="result-empty" class="alert alert-info alert-soft" style="display: none;">
          <span>沒有符合條件的卡片。試著少填幾個欄位。</span>
        </div>

        <div class="rg-table-card" id="result-table">
          <table id="result-card" class="table table-zebra rg-table rg-card-table">
            <thead>
              <tr>
                <th>id</th>
                <th>year</th>
                <th>sports</th>
                <th>publisher</th>
                <th>set</th>
                <th>player</th>
                <th>auto</th>
                <th>insert</th>
                <th>parallel</th>
                <th>numbered</th>
                <th>grade</th>
                <th>value</th>
                <th>tags</th>
                <th>action</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </body>
</html>
